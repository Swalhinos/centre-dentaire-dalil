name: Rebrand to Dalil
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow for favicons
        run: pip install pillow -q
      - name: Rebrand to Centre Dentaire Dalil
        run: |
          python3 - <<'PY'
          import os, re, sys
          from pathlib import Path
          ROOT = Path('.')
          REPS = [
            ("https://www.facebook.com/docsam1979", "https://www.facebook.com/search/top?q=Centre%20Dentaire%20Dalil"),
            ("https://www.instagram.com/dr.issam.mahjoub", "https://www.instagram.com/centre_dentaire_dalil"),
            ("@dr.issam.mahjoub", "@centre_dentaire_dalil"),
            ("dr.issam.mahjoub", "centre_dentaire_dalil"),
            ("+216 98 800 749", "+212 666-161623"),
            ("+21698800749", "212666161623"),
            ("21698800749", "212666161623"),
            ("+216", "+212"),
            ("35.729397, 10.579867", "34.221255, -4.0067704"),
            ("35.729397,10.579867", "34.221255,-4.0067704"),
            ("Monday to Friday 09:00-18:00, Saturday 09:00-14:00", "Monday to Saturday 09:00-19:00"),
            ("Msaken, Sousse, Tunisia", "Taza, Morocco"),
            ("Msaken, Sousse region, Tunisia", "Taza, Morocco"),
            ("Msaken, Sousse", "Taza"),
            ("dans la région de Sousse", "au Maroc"),
            ("in the Sousse region", "in Morocco"),
            ("Dr Issam Mahjoub", "Dr Houssam Eddine Dalil"),
            ("Issam Mahjoub", "Houssam Eddine Dalil"),
            ("Dr Mahjoub", "Dr Dalil"),
            ("Mahjoub", "Dalil"),
            ("Issam", "Dalil"),
            ("Msaken", "Taza"),
            ("Sousse", "Taza"),
            ("Tunisie", "Maroc"),
            ("Tunisia", "Morocco"),
            ("Tunisian", "Moroccan"),
            ("dr-issam-mahjoub-dental", "centre-dentaire-dalil"),
            ("الدكتور عصام محجوب", "الدكتور حسام الدين دليل"),
            ("عصام محجوب", "حسام الدين دليل"),
            ("محجوب", "دليل"),
            ("عصام", "حسام الدين دليل"),
            ("مساكن، سوسة", "تازة"),
            ("مساكن", "تازة"),
            ("سوسة", "تازة"),
            ("تونسية", "مغربية"),
            ("تونسي", "مغربي"),
            ("تونس", "المغرب"),
            ("Taza, Taza", "Taza"),
          ]
          TEXT_EXT = {".ts", ".tsx", ".js", ".mjs", ".json", ".md", ".yml", ".yaml", ".css"}
          SKIP = {".github/workflows/rebrand-dalil.yml", "pnpm-lock.yaml"}
          def text_files():
            for p in sorted(ROOT.rglob("*")):
              if not p.is_file(): continue
              rel = str(p)
              if rel.startswith(".git/"): continue
              if rel in SKIP: continue
              if p.suffix in TEXT_EXT: yield p
          for p in text_files():
            try: s = p.read_text(encoding="utf-8")
            except Exception: continue
            orig = s
            for a, b in REPS: s = s.replace(a, b)
            if s != orig: p.write_text(s, encoding="utf-8")
          tr = Path("lib/translations.ts")
          s = tr.read_text(encoding="utf-8")
          s = re.sub(r"export const CLINIC = \{[^}]*\}", "export const CLINIC = {\n  name: 'Centre Dentaire Dalil',\n  doctor: 'Dr Houssam Eddine Dalil',\n  phoneDisplay: '+212 666-161623',\n  phone: '212666161623',\n  whatsapp: 'https://wa.me/212666161623',\n  address: 'Résidence Salam, Avenue Allal Ben Abdellah, 3ème étage, Taza',\n  mapsUrl: 'https://www.google.com/maps/dir/?api=1&destination=34.221255,-4.0067704',\n  mapsEmbed: 'https://www.google.com/maps?q=34.221255,-4.0067704&z=15&output=embed',\n}", s, count=1)
          def hours_repl(m):
            inner = m.group(0)
            if "Lundi" in inner: return "hours: ['Lundi – Samedi : 09:00 – 19:00']"
            if "Monday" in inner: return "hours: ['Monday – Saturday: 09:00 – 19:00']"
            return "hours: ['الاثنين – السبت: 09:00 – 19:00']"
          s = re.sub(r"hours: \[[^\]]+\]", hours_repl, s)
          notes = ["Lien Facebook à confirmer par le cabinet — cette carte renvoie vers une recherche Facebook, et non vers une page vérifiée.", "Facebook link to be confirmed by the clinic — this card links to a Facebook search, not a verified page.", "رابط فيسبوك بانتظار تأكيد العيادة — هذه البطاقة ترتبط ببحث فيسبوك، وليست صفحة موثّقة."]
          it = iter(notes)
          s = re.sub(r"tiktokNote: '[^']*',", lambda m: "facebookNote: '" + next(it) + "',", s)
          tr.write_text(s, encoding="utf-8")
          cw = Path("components/chat-widget.tsx")
          if cw.exists():
            s = cw.read_text(encoding="utf-8")
            s = s.replace("{ fr: 'Notre page Facebook', ar: 'صفحتنا على فيسبوك', en: 'Our Facebook page' }", "{ fr: 'Recherche Facebook', ar: 'بحث فيسبوك', en: 'Facebook search' }")
            s = s.replace("{ fr: 'Dr Houssam Eddine Dalil', ar: 'Dr Houssam Eddine Dalil', en: 'Dr Houssam Eddine Dalil' }", "{ fr: 'Centre Dentaire Dalil', ar: 'Centre Dentaire Dalil', en: 'Centre Dentaire Dalil' }")
            cw.write_text(s, encoding="utf-8")
          Path("components/logo-mark.tsx").write_text('''export function LogoMark({ variant = 'light', className = 'h-10 w-10' }: { variant?: 'light' | 'dark'; className?: string }) {
            const id = variant === 'dark' ? 'dalil-tooth-dark' : 'dalil-tooth-light'
            return (
              <svg viewBox="0 0 48 48" fill="none" className={className} aria-hidden="true">
                <defs>
                  <linearGradient id={id} x1="0" y1="0" x2="48" y2="48">
                    <stop offset="0%" stopColor="#1A7A6B" />
                    <stop offset="100%" stopColor="#14273D" />
                  </linearGradient>
                </defs>
                <circle cx="24" cy="24" r="23" fill={variant === 'dark' ? '#FFFFFF' : `url(#${id})`} opacity={variant === 'dark' ? 0.15 : 1} />
                <path d="M15 10c2.5-2 5.5-2 9 0 3.5-2 6.5-2 9 0 2 3 1.5 7-0.5 11-1 4-2 8-4.5 8-2 0-2.5-4-4.5-4-2 0-2.5 4-4.5 4-2.5 0-3.5-4-4.5-8-2-4-2.5-8-0.5-11Z" fill="#FFFFFF" />
              </svg>
            )
          }
          ''', encoding="utf-8")
          for fname, variant in [("components/site-header.tsx", "light"), ("components/site-footer.tsx", "dark")]:
            p = Path(fname)
            s = p.read_text(encoding="utf-8")
            s = re.sub(r"<Image[^>]*src=\"/images/logo-(?:color|white)\.png\"[^>]*/>", f"<LogoMark variant=\"{variant}\" className=\"h-10 w-10\" />", s, flags=re.DOTALL)
            s = s.replace("import Image from 'next/image'\n", "")
            if "logo-mark" not in s:
              s = s.replace("from 'lucide-react'", "from 'lucide-react'", 1)
              s = re.sub(r"(import[^\n]*\n)", r"\1import { LogoMark } from '@/components/logo-mark'\n", s, count=1)
            p.write_text(s, encoding="utf-8")
          ap = Path("components/about.tsx")
          if ap.exists():
            s = ap.read_text(encoding="utf-8")
            s = s.replace('src="/images/doctor.jpg"', 'src="/images/clinic-hero.jpg"')
            s = re.sub(r'alt="[^"]*"', 'alt="Interior of Centre Dentaire Dalil"', s, count=1)
            ap.write_text(s, encoding="utf-8")
          Path("components/social-icons.tsx").write_text('''import { FacebookIcon, InstagramIcon } from '@/components/brand-icons'
          const links = [
            { label: 'Facebook', url: 'https://www.facebook.com/search/top?q=Centre%20Dentaire%20Dalil', Icon: FacebookIcon },
            { label: 'Instagram', url: 'https://www.instagram.com/centre_dentaire_dalil', Icon: InstagramIcon },
          ]
          export function SocialIcons({ className = '', tone = 'light' }: { className?: string; tone?: 'light' | 'dark' }) {
            const linkClass = tone === 'dark' ? 'text-navy-foreground/70 transition-colors hover:bg-navy-foreground/10 hover:text-primary' : 'text-muted-foreground transition-colors hover:bg-primary/10 hover:text-navy'
            return (
              <div className={`flex items-center gap-1 ${className}`}>
                {links.map(({ label, url, Icon }) => (
                  <a key={label} href={url} target="_blank" rel="noopener noreferrer" aria-label={label} className={`flex size-9 items-center justify-center rounded-full ${linkClass}`}>
                    <Icon className="size-4" />
                  </a>
                ))}
              </div>
            )
          }
          ''', encoding="utf-8")
          Path("components/social-section.tsx").write_text('''"use client"
          import { BadgeCheck } from 'lucide-react'
          import { useLanguage } from '@/lib/language-context'
          import { FacebookIcon, InstagramIcon } from '@/components/brand-icons'
          const FACEBOOK_URL = 'https://www.facebook.com/search/top?q=Centre%20Dentaire%20Dalil'
          const INSTAGRAM_URL = 'https://www.instagram.com/centre_dentaire_dalil'
          export function SocialSection() {
            const { t } = useLanguage()
            const cards = [
              { name: 'Facebook', handle: 'Centre Dentaire Dalil', url: FACEBOOK_URL, desc: t.social.facebookDesc, Icon: FacebookIcon, verified: false },
              { name: 'Instagram', handle: '@centre_dentaire_dalil', url: INSTAGRAM_URL, desc: t.social.instagramDesc, Icon: InstagramIcon, verified: true },
            ]
            return (
              <section id="social" className="py-16 lg:py-24">
                <div className="mx-auto max-w-6xl px-4 lg:px-6">
                  <div className="mx-auto mb-12 flex max-w-2xl flex-col items-center gap-4 text-center">
                    <span className="rounded-full bg-background px-4 py-1.5 text-xs font-medium text-navy">{t.social.badge}</span>
                    <h2 className="font-serif text-3xl font-semibold text-navy text-balance md:text-4xl">{t.social.title}</h2>
                    <p className="leading-relaxed text-muted-foreground text-pretty">{t.social.subtitle}</p>
                  </div>
                  <div className="grid gap-6 md:grid-cols-2">
                    {cards.map(({ name, handle, url, desc, Icon, verified }) => (
                      <article key={name} className="flex flex-col items-start gap-3 rounded-3xl border border-border bg-card p-6">
                        <span className="flex size-12 items-center justify-center rounded-full bg-primary/10 text-navy"><Icon className="size-6" /></span>
                        <h3 className="font-serif text-xl font-semibold text-navy">{name}</h3>
                        <p className="text-sm text-muted-foreground">{handle}</p>
                        <p className="flex-1 leading-relaxed text-muted-foreground">{desc}</p>
                        {verified ? (<span className="flex items-center gap-1.5 text-sm font-medium text-navy"><BadgeCheck className="size-4" />{t.social.verified}</span>) : (<p className="text-sm font-medium text-amber-700">{t.social.facebookNote}</p>)}
                        <a href={url} target="_blank" rel="noopener noreferrer" className="mt-1 inline-flex items-center gap-2 rounded-full bg-navy px-5 py-2.5 text-sm font-medium text-navy-foreground transition-colors hover:bg-navy/90">{t.social.cta}</a>
                      </article>
                    ))}
                  </div>
                </div>
              </section>
            )
          }
          ''', encoding="utf-8")
          bi = Path("components/brand-icons.tsx")
          if bi.exists():
            s = bi.read_text(encoding="utf-8")
            start = s.find("TikTokIcon")
            if start != -1:
              begin = s.rfind("export function", 0, start)
              nxt = s.find("export function", start)
              if begin != -1 and nxt != -1: s = s[:begin] + s[nxt:]
              bi.write_text(s, encoding="utf-8")
          Path("README.md").write_text("# Centre Dentaire Dalil — Dental Clinic Website\n\nStatic Next.js website for Centre Dentaire Dalil, Dr Houssam Eddine Dalil, chirurgien-dentiste in Taza, Maroc.\n\n- Phone / WhatsApp: +212 666-161623 (wa.me/212666161623)\n- Address: Résidence Salam, Avenue Allal Ben Abdellah, 3ème étage, Taza\n- Coordinates (Google Maps, verified): 34.221255, -4.0067704\n- Languages: French (default), Arabic (RTL), English\n- Booking form opens WhatsApp with the form details prefilled in the selected language\n- Social: Instagram (instagram.com/centre_dentaire_dalil) verified; Facebook links to a Facebook search, clearly marked as a placeholder (no verified page URL supplied)\n- Before/after slider uses one composite photo, AFTER layer clipped on top of BEFORE, captioned as an illustrative example, not a patient of this clinic\n- Chatbot: instant FAQ layer in French, Arabic and English, plus a guarded AI layer (GEMINI_API_KEY, server-side only). Prices and medical questions are deflected to WhatsApp.\n- Logo: typographic gradient tooth mark + wordmark (no clinic logo file was supplied)\n- Placeholders the clinic must still confirm: opening hours (shown as Lun–Sam 09:00–19:00), hero stats, testimonials, doctor portrait (about section uses a clinic interior photo)\n- Build: pnpm install, then pnpm run build (static export in out/).\n", encoding="utf-8")
          for f in ["assets/logo-original.jpg", "public/images/logo-color.png", "public/images/logo-silver.png", "public/images/logo-white.png", "public/images/doctor.jpg", "scripts/rebrand.py", "scripts/content_translations.py", "scripts/content_components.py", ".github/workflows/rebrand.yml", ".github/workflows/extract.yml"]:
            try: os.remove(f)
            except Exception: pass
          try:
            from PIL import Image as PILImage, ImageDraw, ImageFont
            for size, out in [(512, "public/favicon.png"), (512, "public/icon-512.png"), (192, "public/icon-192.png"), (180, "public/apple-icon.png")]:
              img = PILImage.new("RGBA", (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              d.rounded_rectangle([0, 0, size - 1, size - 1], radius=int(size * 0.22), fill=(20, 39, 61, 255))
              try: font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", int(size * 0.62))
              except Exception: font = ImageFont.load_default()
              bb = d.textbbox((0, 0), "D", font=font)
              w = bb[2] - bb[0]; h = bb[3] - bb[1]
              d.text(((size - w) / 2 - bb[0], (size - h) / 2 - bb[1]), "D", font=font, fill=(255, 255, 255, 255))
              img.save(out)
          except Exception as e: print("favicon skipped", e)
          banned = ["issam", "mahjoub", "msaken", "sousse", "tunisie", "tunisia", "+216", "21698800749", "docsam1979", "dr.issam", "dr-issam", "عصام", "محجوب", "مساكن", "سوسة", "تونس"]
          bad = []
          for p in text_files():
            try: low = p.read_text(encoding="utf-8").lower()
            except Exception: continue
            for b in banned:
              if b in low: bad.append(str(p) + ":" + b)
          if bad:
            print("BANNED STRINGS FOUND:")
            for x in bad: print(x)
            sys.exit(1)
          for needle in ["Centre Dentaire Dalil", "Dr Houssam Eddine Dalil", "212666161623", "34.221255", "centre_dentaire_dalil"]:
            found = any(needle in p.read_text(encoding="utf-8") for p in text_files())
            if not found: print("MISSING", needle); sys.exit(1)
          print("REBRAND OK")
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/rebrand-dalil.yml
          git config user.name "Dalil Rebrand"
          git config user.email "rebrand@centre-dentaire-dalil.local"
          git add -A
          git diff --cached --quiet || git commit -m "Rebrand to Centre Dentaire Dalil (Taza, Maroc)"
          git push
